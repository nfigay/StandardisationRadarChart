        function doElemsMultiTypes(elems) {
            const classDict = {};
            for (let i = 0; i < elems.length; i++) {
                classDict[elems[i].data('edgeType')] = true;
            }
            return Object.keys(classDict).length > 1;
        }
        function exportVisibleGraphToFile(cy) {
            let graphData = [];

            // Extract visible nodes
            cy.nodes(':visible').forEach(node => {
                let nodeData = {
                    data: {
                        id: node.id(),
                        label: node.data('label'),
                    }
                };

                let parent = node.parent();
                if (parent.length > 0) {
                    nodeData.data.parent = parent.id();
                }

                let classes = node.classes();
                if (classes) {
                    nodeData.classes = classes;
                }

                graphData.push(nodeData);
            });

            // Extract visible edges
            cy.edges(':visible').forEach(edge => {
                let edgeData = {
                    data: {
                        id: edge.id(),
                        source: edge.source().id(),
                        target: edge.target().id(),
                        label: edge.data('label'),
                        type: edge.data('type')
                    },
                    classes: edge.classes() // Récupération directe des classes existantes
                };

                let edgeType = edge.data('edgeType');
                if (edgeType) {
                    edgeData.data.edgeType = edgeType;
                }

                graphData.push(edgeData);
            });


            // Convertir en JSON et créer un Blob
            let jsonString = JSON.stringify(graphData, null, 2);
            let blob = new Blob([jsonString], { type: "application/json" });

            // Créer un lien de téléchargement
            let a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            var filename = "owl.json"
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // CSV SSR tabular v0: preserve visible Cytoscape node properties, not full graph layout.
        function exportVisibleRadarCSV(cytoscapeGraph, papa) {
            const nodes = cytoscapeGraph.nodes(':visible').toArray();
            const rows = nodes.map(node => ({ ...node.data() }));
            const fields = [...new Set(rows.flatMap(row => Object.keys(row)))];
            if (rows.length === 0 || fields.length === 0) return '';
            const data = rows.map(row => fields.map(field => {
                const value = row[field];
                if (value == null) return '';
                const text = typeof value === 'object' ? JSON.stringify(value) : String(value);
                // Prevent CSV formula execution when opening exported data in spreadsheets.
                return /^[=+\-@\t\r]/.test(text) ? "'" + text : text;
            }));
            return papa.unparse({ fields, data }, { quotes: true });
        }

                onClick(event) {

                    const target = event.target.split(':')[0]; // Get the part before the colon

                    // Protect published/archived revisions at the existing W2UI action boundary.
                    const readonlyToolbarAllowed = ['item2', 'createdraft', 'newcatalog', 'loadcatalogjson',
                        'savecatalogjson', 'savegraphssr', 'savecsvssr'];
                    const safeLockedMode = target === 'item4' && subTarget === 'locked';

                    switch (target) {

                            }
                            break;

                                        allowZoneChanges = false
                                        break;
                                    case 'grabon':
                                        cy.nodes().grabify();
                                        allowZoneChanges = false
                                        break;
                                    case 'changeon':
                                        cy.nodes().grabify();
                                        allowZoneChanges = true
                                        break;
                                }
                            }
                            break;

                        case 'createdraft':
                            // Handled once by the item's onClick, never twice here.
                            break;
                        case 'newcatalog':
                            handleNewCatalog();
                            break;
                        case 'loadcatalogjson':
                            window.__radarCatalogUI.openFile();
                            break;
                        case 'savecatalogjson':
                            try {
                                if(window.__radarWorkspaceExplorer?.status?.().sources.some(s=>s.kind==='asd'))
                                    throw Error('ASD workspace conversion to catalog JSON is not supported yet; export refused to avoid dropping ASD radars.');
                                Promise.resolve(window.__radarCatalogPersistence.download(cy)).catch(error => {
                                    console.error('Catalog export rejected:', error);
                                    w2alert('Catalog export rejected: ' + error.message);
                                });
                            } catch (error) {
                                console.error('Catalog export rejected:', error);
                                w2alert('Catalog export rejected: ' + error.message);
                            }
                            break;
                        case 'loadcsvssr': {
                            // Dedicated one-shot picker: do not reuse #inputfile (its existing handler can clear the graph).
                            if (typeof Papa === 'undefined' || typeof Papa.parse !== 'function' ||
                                !window.__radarCSVSSR || typeof cy === 'undefined' || !cy) {
                                w2alert('CSV SSR importer is not ready.');
                                break;
                            }
                            const picker = document.createElement('input');
                            picker.type = 'file';
                            picker.accept = '.csv,text/csv';
                            picker.style.display = 'none';
                            document.body.appendChild(picker);
                            picker.onchange = () => {
                                const file = picker.files?.[0];
                                picker.remove();
                                if (!file) return;
                                if (file.size > 10 * 1024 * 1024) {
                                    w2alert('CSV SSR file exceeds the 10 MB limit.');
                                    return;
                                }
                                Papa.parse(file, {
                                    header: true,
                                    beforeFirstChunk: chunk => chunk.replace(/^\uFEFF/, ''),
                                    skipEmptyLines: 'greedy',
                                    complete: (result) => {
                                        try {
                                            const existing = cy.nodes().map(n => ({ ...n.data() }));
                                            const plan = window.__radarCSVSSR.prepareCSVSSRImport(result, existing);
                                            // No silent replacement: ask before any live graph mutation.
                                            const summary = `CSV SSR: ${plan.total} rows, ${plan.additions.length} additions, ` +
                                                `${plan.updates.length} updates, ${plan.unchanged.length} unchanged. ` +
                                                `Merge into the current graph? No nodes or edges will be deleted.`;
                                            w2confirm(summary).yes(() => {
                                                try {
                                                    const fresh = window.__radarCSVSSR.prepareCSVSSRImport(
                                                        result, cy.nodes().map(n => ({ ...n.data() })));
                                                    if (fresh.additions.length !== plan.additions.length ||
                                                        fresh.updates.length !== plan.updates.length) {
                                                        w2alert('Graph changed during confirmation; please retry import.');
                                                        return;
                                                    }
                                                    for (const item of fresh.additions) {
                                                        if (!Number.isFinite(item.data.x) || !Number.isFinite(item.data.y)) {
                                                            w2alert('New CSV SSR nodes require numeric x and y coordinates.');
                                                            return;
                                                        }
                                                    }
                                                    const applied = window.__radarCSVSSR.applyCSVSSRImport(fresh, cy);
                                                    w2alert(`CSV SSR merge complete: ${applied.added} added, ${applied.updated} updated, ${applied.unchanged} unchanged.`);
                                                } catch (error) {
                                                    console.error('CSV SSR merge failed:', error);
                                                    w2alert(`CSV SSR merge failed: ${error.message}`);
                                                }
                                            });
                                        } catch (error) {
                                            console.error('CSV SSR validation failed:', error);
                                            w2alert(`CSV SSR rejected: ${error.message}`);
                                        }
                                    },
                                    error: (error) => {
                                        console.error('CSV SSR parse failed:', error);
                                        w2alert('CSV SSR file could not be read.');
                                    }
                                });
                            };
                            picker.click();
                            break;
                        }
                        case 'savecsvssr': {
                            if (typeof cy === 'undefined' || !cy || typeof Papa === 'undefined' || typeof Papa.unparse !== 'function') {
                                w2alert('Radar or CSV library unavailable.');
                                break;
                            }
                            const csv = exportVisibleRadarCSV(cy, Papa);
                            if (!csv) {
                                w2alert('No visible radar nodes to export.');
                                break;
                            }
                            const blob = new Blob(['\uFEFF', csv], { type: 'text/csv;charset=utf-8' });
                            const url = URL.createObjectURL(blob);
                            const link = document.createElement('a');
                            link.href = url;
                            link.download = 'radar-blips.csv';
                            document.body.appendChild(link);
                            link.click();
                            link.remove();
                            setTimeout(() => URL.revokeObjectURL(url), 1000);
                            break;
                        }
                        case 'savegraphssr':
                            // downloadCompleteRadarData()

        // Read-only is not a dead end: explicitly offer to derive a new working revision.
        // This NEVER edits a published/archived snapshot and requires user confirmation.
        function offerDraftForReadOnlyAction() {
            if (!window.__radarApplicationProfile.allows('revision.create')) return;
            const group = window.__radarRevisionSession?.status?.().activeGroup;
            const revision = window.__radarCatalogAdapter?.getRevision?.(group);
            if (!revision || revision.status === 'draft') {
                w2alert(i18next.t('menu.catalogForm.draftRequired'));
                return;
            }
            if (typeof window.confirm !== 'function') {
                w2alert(i18next.t('menu.catalogForm.readOnly'));
                return;
            }
            if (window.confirm(i18next.t('menu.catalogForm.protectedConfirm',{status:i18next.t('menu.catalogForm.status.'+revision.status),interpolation:{escapeValue:false}}))) {
                handleCreateOrOpenDraft();
            }
        }

        function handleMenuAction(event) {
            if (window.__radarApplicationProfile.viewer &&
                !window.__radarApplicationProfile.allowsMenu(event.target)) return;
            // The main Files menu is the sole visible entry point for file actions.
            // Reuse the existing toolbar action handler without duplicating IO code.
            // The toolbar guard protects graph mutations. Exporting catalog JSON is read-only
            // and must remain available after publishing or archiving a revision.
            const fileActions = ['newcatalog', 'loadcatalogjson', 'savecatalogjson',
                'loadgraphssr', 'savegraphssr', 'loadcsvssr', 'savecsvssr'];
            if (typeof event.target === 'string' && event.target.startsWith('files:')) {
                const fileAction = event.target.slice('files:'.length);
                if (fileActions.includes(fileAction)) {
                    // Check BEFORE delegation: the Files submenu otherwise bypasses
                    // the top-level read-only policy entirely.
                    if (!window.__radarApplicationProfile.viewer &&
                        window.__radarCatalogUI?.isReadOnly() &&
                        !['savecatalogjson', 'newcatalog'].includes(fileAction)) {
                        offerDraftForReadOnlyAction();
                        return;
                    }
                    if (!w2ui.toolbar || typeof w2ui.toolbar.onClick !== 'function') {
                        w2alert(i18next.t('menu.files') + ': toolbar unavailable');
                        return;
                    }
                    w2ui.toolbar.onClick({ target: fileAction });
                }
                return;
            }
            // Top-level menu activation is navigation, not a graph mutation.
            // Never intercept a parent menu before the user can select permitted actions.
            if (typeof event.target === 'string' && !event.target.includes(':')) return;
            // Consultation remains usable for published revisions. These cases
            // have no graph-data mutations; layout/import/graph editing stay blocked.
            const readonlyMenuAllowed = ['asd2019:loadasd', 'files:newcatalog', 'files:savecatalogjson', 'radartools:createdraft',
                'radartools:modeLocked', 'radartools:showEditor', 'radartools:publishcatalogrevision', 'radartools:exportclientroadmap', 'radartools:archivecatalogrevision', 'radartools:selectcatalogrevision', 'radartools:renameradar', 'radartools:renamerevision', 'radartools:standardregistry', 'view:nodeRendering', 'view.edgeRendering',
                'language:fr', 'language:en', 'owl:exportjson', 'owl:savegraph'];
            if (!window.__radarApplicationProfile.viewer &&
                window.__radarCatalogUI?.isReadOnly() &&
                !readonlyMenuAllowed.includes(event.target)) {
                offerDraftForReadOnlyAction();
                return;
            }
            switch (event.target) {
                case 'asd2019:loadasd':
                    try {
                        window.__radarWorkspaceExplorer.loadASD(getWorkingGroupsWithCount());
                    } catch(e) {w2alert(e.message);}
                    break;
                case 'radartools:selectcatalogrevision':
                    try { window.__radarCatalogUI.openRevisionPicker(); }

                case 'radartools:renameradar':

                case 'radartools:standardregistry':

                    break;
                case 'radartools:createdraft':
                    handleCreateOrOpenDraft();

                case 'radartools:exportclientroadmap': {
                    // User-initiated export: published revision only.
                    // Nothing is published to a server or stored in IndexedDB.
                    Promise.resolve().then(async () => {
                        const group=window.__radarRevisionSession?.status?.().activeGroup;
                        const revision=window.__radarCatalogAdapter?.getRevision?.(group);
                        if(!group || !revision || revision.status!=='published')
                            throw Error('Sélectionner une révision publiée avant export.');
                        const persistence=window.__radarCatalogPersistence;
                        if(!persistence?.ownsRevision?.(group,revision.revisionId))
                            throw Error('Révision absente du catalogue actif.');

                        // Reuse the authoritative Creator catalogue.
                        // The projection emits ONLY the selected revision,

                        const source=persistence.build(cy);

        // Create Node Function
        function createNode(id, label, type, IRI, parent = null) {
            // Prepare the node data
            const nodeData = {
                id,
                label,
                type,
                IRI
            };
            // Add the parent only if it is defined
            if (parent) {
                nodeData.parent = parent;
            }
            // Push the node data to the array
            nodes.push({
                group: 'nodes',
                data: nodeData,
                classes: type
            });
            //   console.log(`I'm creating a node with id=${nodeData.id}`)
        }

        function updateNode(id, characteristics = {}) {
            // Find the node by id
            //alert ("updateNode:(" +id+")")
            const node = nodes.find(n => n.data.id === id);

            // If the node exists, update its characteristics
            if (node) {
                // Check if the object contains specific characteristics and update accordingly
                if (characteristics.functional) {
                    node.data.functional = true;
                    node.data.label = '→' + node.data.label;
                }
                if (characteristics.transitive) {
                    node.data.transitive = true;
                    node.data.label = '△' + node.data.label;
                }
                if (characteristics.inverseFunctional) {
                    node.data.inverseFunctional = true;
                    node.data.label = '←' + node.data.label;
                }
                if (characteristics.irreflexive) {
                    node.data.irreflexive = true;
                    node.data.label = '𐌗◯' + node.data.label;
                }
                if (characteristics.reflexive) {
                    node.data.reflexive = true;
                    node.data.label = '◯' + node.data.label;
                }
                if (characteristics.namedNodemetric) {
                    node.data.namedNodemetric = true;
                    node.data.label = '↔' + node.data.label;
                }
                if (characteristics.asymmetric) {
                    node.data.asymmetric = true;
                    node.data.label = '𐌗↔' + node.data.label;
                }
                //alert (JSON.stringify(node))
            }
        }

            // Retrieve the style for the given type

                        });
                    } catch (retryError) {
                        console.error(`Failed again to add edge ${edge.data.id}:`, retryError);
                    }

                }
            });
            console.log("Graph successfully imported into Cytoscape!");
            // Déplier tout au chargement
            api.expandAll();
            api.collapseAllEdges(getEdgeOptions())
        }

        myLayout.on('resize', function (event) {
            setTimeout(() => window.__radarViewportSync?.(), 100);
        });



        //// Loading files
        document.getElementById('load-from-inp').addEventListener('change', function () {
            if (window.__radarCatalogUI?.isReadOnly()) { w2alert('Published revision is read-only.'); this.value=''; return; }
           
            readTxtFile(this.files[0], function (txt) {
                w2confirm('Do you want to replace? If yes, current graph will be removed, if no, it will be fusionned with the import)')
                    .yes(() => {
                        if (window.__radarCatalogUI?.isReadOnly()) { w2alert('Published revision is read-only.'); return; }
                        window.__radarRevisionSession.beforeExternalReplace(cy);
                        cy.$().remove();
                        api.loadJson(txt);
                        window.__radarRevisionSession.adoptLoaded(cy);

                    })
                    .no(() => {
                        // api.loadJson(txt);
                        alert("Merging content of radards not supported at this stage.")

                    });
            })
        });

        //// Loading files
        document.getElementById('inputfile').addEventListener('change', function (event) {
            if (window.__radarCatalogUI?.isReadOnly()) { w2alert('Published revision is read-only.'); this.value=''; return; }
            const file = event.target.files[0];
            if (!file) {
                alert("No file selected!");
                return;
            }
            w2confirm(i18next.t(`confirm.replacegraph`))
                .yes(() => {
                    if (window.__radarCatalogUI?.isReadOnly()) { w2alert('Published revision is read-only.'); return; }
                    cy.$().remove();
                    openCSV(file); // Pass file object
                })
                .no(() => {
                    if (window.__radarCatalogUI?.isReadOnly()) { w2alert('Published revision is read-only.'); return; }
                    openCSV(file); // Pass file object
                });
        });


        document.getElementById('jsonl-hidden-input').addEventListener('change', function (e) {
            if (window.__radarCatalogUI?.isReadOnly()) { w2alert('Published revision is read-only.'); this.value=''; return; }
            const file = e.target.files[0];
            if (!file) return;

            const maxSizeMB = 100;
            const fileSizeMB = file.size / (1024 * 1024);
            if (fileSizeMB > maxSizeMB) {
                alert(`Le fichier est trop volumineux (${fileSizeMB.toFixed(2)} MB). Veuillez sélectionner un fichier de moins de ${maxSizeMB} MB.`);
                e.target.value = '';
                return;
            }

            readJSONLFile(file, (jsonArray) => {
                const graphData = {
                    nodes: [],
                    edges: []
                };

                const nodeIndex = new Map();
                const edgeIndex = new Set();

                // Racine du graphe
                const rootNode = {
                    data: {
                        id: "iso-tc",
                        label: "ISO Technical Committees",
                        type: "business-actor",
                        specialization: "isotc"
                    }
                };
                graphData.nodes.push(rootNode);
                nodeIndex.set(rootNode.data.id, rootNode);

                function ensureOrgNode(org) {
                    const orgNodeId = org.id;
                    if (!nodeIndex.has(orgNodeId)) {
                        const node = {
                            data: {
                                id: orgNodeId,
                                label: org.acronym || org.name || orgNodeId,
                                type: 'organization',
                                specialization: 'member-body'
                            }
                        };
                        graphData.nodes.push(node);
                        nodeIndex.set(orgNodeId, node);
                    }
                    return orgNodeId;
                }

                function addEdge(source, target, label, type) {
                    return;
                    const edgeId = `rel-${source}-${label}-${target}`;
                    if (!edgeIndex.has(edgeId)) {
                        graphData.edges.push({
                            data: {
                                id: edgeId,
                                source,
                                target,
                                edgeType: type,
                                label
                            }
                        });
                        edgeIndex.add(edgeId);
                    }
                }

                function processMembers(tc, nodeId, members, label) {
                    if (label == 'committeeLiaison') {
                        if (!Array.isArray(members)) return;
                        members.forEach(member => {
                            const memberNodeId = ensureOrgNode(member);
                            addEdge(nodeId, memberNodeId, label, 'aggregation');
                        });

                    }
                    else {
                        if (!Array.isArray(members)) return;
                        members.forEach(member => {
                            const memberNodeId = ensureOrgNode(member);
                            addEdge(nodeId, memberNodeId, label, 'aggregation');
                        });
                    }
                }

                jsonArray.forEach(tc => {
                    const nodeId = tc.id;
                    const nodeData = {
                        id: nodeId,
                        label: tc.reference,
                        type: 'business-actor',
                        specialization: 'isotc',
                        description: tc.title?.en || ''
                    };

                    if (tc.parentId !== null) {
                        nodeData.parent = tc.parentId;
                    } else {
                        nodeData.parent = 'iso-tc';
                    }

                    const relationKeys = ['pMembers', 'oMembers', 'committeeLiaisons', 'organizationLiaisons', 'childrenId'];

                    Object.entries(tc).forEach(([key, value]) => {
                        if (key === 'parentId' || key === 'id' || relationKeys.includes(key)) return;
                        if (value && typeof value === 'object' && !Array.isArray(value)) {
                            Object.entries(value).forEach(([subKey, subValue]) => {
                                nodeData[`${key}.${subKey}`] = subValue;
                            });
                        } else {
                            nodeData[key] = value;
                        }
                    });

                    const node = { data: nodeData };
                    graphData.nodes.push(node);
                    nodeIndex.set(nodeId, node);

                    processMembers(tc, nodeId, tc.pMembers, 'pMember');
                    processMembers(tc, nodeId, tc.oMembers, 'oMember');
                    processMembers(tc, nodeId, tc.committeeLiaisons, 'committeeLiaison');
                    processMembers(tc, nodeId, tc.organizationLiaisons, 'organizationLiaison');

                    if (tc.parentId !== null) {
                        const parentId = tc.parentId;
                        addEdge(parentId, nodeId, 'subCommitteeOf', 'composition');
                    }
                });

                const blob = new Blob([JSON.stringify(graphData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'tc-graph.json';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 0);

                e.target.value = '';
            }, (err, line, i) => {
                alert(`Erreur à la ligne ${i + 1}: ${line}`);
            });
        });


        // Initialize Cytoscape.js
        var elements = [
            //  { data: { id: 'a', label: "Feed the radar" }, position: { x: 400, y: 400 } },

        ];
        cy = cytoscape({
            container: document.getElementById("cy-container"),
            elements: elements,
            style: RadarStyle,
            zoomingEnabled: true,         // Allow programmatic viewport zoom
            userZoomingEnabled: false,     // Disable user-initiated zooming
            userPanningEnabled: false,     // Disable user-initiated panning
            panningEnabled: true,         // Allow programmatic viewport pan
            autolock: false,                // Lock nodes in place (prevents accidental grabbing)
            autoungrabify: window.__radarApplicationProfile.viewer,           // Prevents nodes from being grabbed and moved
            layout: {
                name: 'preset',            // Use 'preset' layout to respect given node positions
                fit: false,                // Prevent auto-fit adjustment after layout
                padding: 30                // Optional padding for the layout
            }
        });
        console.log(cy.zoom())
        console.log(cy.pan())
        // Ajout des plugins
        var ur = cy.undoRedo();

        var api = cy.expandCollapse({
            layoutBy: { name: 'fcose', animate: true },
            fisheye: true,
            animate: 'end',
            undoable: true
        });


        cy.on('grab', 'node', function (evt) {
            let node = evt.target;
            let pos = node.position();
            let { zone, quadrant } = getZone(pos.x, pos.y, radii);

            console.log(`GRAB: Node ${node.id()} -> Zone: ${zone}, Quadrant: ${quadrant}`);

            // Vérifier que getZone() retourne bien une valeur correcte
            if (zone === undefined || quadrant === undefined) {
                console.error(`⚠️ ERREUR: getZone() a retourné undefined pour le noeud ${node.id()}`);
                return;
            }

            // Stocker la position et les attributs initiaux
            node.scratch('_initialPosition', { x: pos.x, y: pos.y });
            node.scratch('_initialZone', zoneRingMapping[zone]); // Stocke la valeur en texte ("Track", "Candidate", ...)
            node.scratch('_initialQuadrant', quadrantMapping[quadrant]); // Stocke en texte ("Monitored", "Available", ...)
        });

        cy.on('free', 'node', function (evt) {
            if (window.__radarCatalogUI?.isReadOnly()) return;
            let node = evt.target;
            let pos = node.position();
            backToInitialPosition = false
            let initialZone = node.scratch('_initialZone');
            let initialQuadrant = node.scratch('_initialQuadrant');


            //  alert ("x:"+ pos.x + " y;"+ pos.y + " raddi:"+ radii)
            let { zone, quadrant } = getZone(pos.x, pos.y, radii);
            //  alert ("zone:"+ zone+ " quadrant:"+ quadrant)
            if (zone === undefined || quadrant === undefined) {
                console.log(`⚠️ ATTENTION: getZone() a retourné undefined pour le noeud ${node.id()}`);
                backToInitialPosition = true;
            }
            else {
                backToInitialPosition = false
                let newZone = zoneRingMapping[zone]; // Convertir la zone en son label
                let newQuadrant = quadrantMapping[quadrant]; // Convertir le quadrant en son label
                console.log(`FREE: Node ${node.id()} -> New Zone: ${newZone}, New Quadrant: ${newQuadrant}`);
                console.log(`Initial Zone: ${initialZone}, Initial Quadrant: ${initialQuadrant}`);

                node.data({
                    ring: newZone,
                    quadrant: newQuadrant
                });

                // Vérifier si la zone ou le quadrant ont changé
                if ((newZone !== initialZone || newQuadrant !== initialQuadrant) && !allowZoneChanges) {
                    //    alert ("newZone:"+ newZone+ " newQuadrant:"+ newQuadrant +"initialZone:"+ initialZone+ " initialQuadrant:"+ initialQuadrant )
                    backToInitialPosition = true
                }
            }


            // Vérifier si la zone ou le quadrant ont changé
            if (backToInitialPosition) {

                console.warn(`Zone ou quadrant modifié pour le nœud ${node.id()}! Retour à la position initiale.`);

                let initialPos = node.scratch('_initialPosition');

                // Animation du retour à la position initiale
                node.animate({
                    position: { x: initialPos.x, y: initialPos.y }
                }, {
                    duration: 300
                });
                console.log("avant")
                console.log(node.data())

                // Réinitialiser les attributs du nœud
                node.data({
                    ring: initialZone,
                    quadrant: initialQuadrant
                });
                console.log("apres")
                console.log(node.data())
            }

            let form = generateFormFromCytoscapeElement(node);

            // Render form inside the right panel of w2ui layout
            w2ui.mainLayout.html('right', '<div id="form"></div>');
            form.render('#form');
        });


        // === CYTOSCAPE EVENT TO DISPLAY FORM IN RIGHT PANEL ===
        cy.on('tap', 'node', function (evt) {
            let node = evt.target;
            let form = generateFormFromCytoscapeElement(node);

            // Render form inside the right panel of w2ui layout
            w2ui.mainLayout.html('right', '<div id="form"></div>');
            form.render('#form');
        });


    </script>
