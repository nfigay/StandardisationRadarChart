name: Standardization Radar Chart - Build distributions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-distribution-build
  cancel-in-progress: false

jobs:
  build-distributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Automated tests
        run: node --test tests/*.test.mjs

      - name: Build Creator
        run: |
          npm run build:pages
          npm run verify:pages
          node tools/check-pages-readiness.mjs --repo . --out .radarchart-build/pages --strict
          test -f .radarchart-build/pages/src/domain/roadmap-published-projection.mjs

      - name: Build Client
        run: |
          npm run build:client
          npm run verify:client

      - name: Assemble products
        run: |
          npm run assemble:products
          npm run verify:products

      - name: Prepare site
        run: |
          node scripts/prepare-pages-products.mjs prepare
          node scripts/prepare-pages-products.mjs verify

      - name: Build final distribution
        run: |
          npm run build:dist
          npm run verify:dist

      - name: Upload verified distribution
        uses: actions/upload-artifact@v4
        with:
          name: radar-web-distribution
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
