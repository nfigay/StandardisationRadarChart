<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>S16-R2 browser qualification</title>
<link rel="stylesheet" href="../css/w2ui.min.css"><style>body{margin:0}#standard-references-panel{width:100%;height:380px;box-sizing:border-box}</style>
<script src="../lib/jquery.min.js"></script><script src="../lib/w2ui.min.js"></script><script src="../lib/i18next.min.js"></script>
<script>Object.defineProperty(window,"indexedDB",{value:undefined,configurable:true});i18next.init({lng:'fr',fallbackLng:'fr',resources:{fr:{translation:{}},en:{translation:{}}},initImmediate:false});</script>
<script src="../js/radar-application-profile.js"></script><script src="../js/radar-publication-model.js"></script><script src="../js/radar-catalog-persistence.js"></script><script src="../js/radar-standard-registry.js"></script><script src="../js/radar-iso-tree-index.js"></script><script src="../js/radar-iso-sidebar-index.js"></script><script src="../js/radar-standard-sources.js"></script><script src="../js/radar-standard-source-dialog.js"></script><script src="../js/radar-standards-panel.js"></script><script src="../js/radar-iso-toolbar.js"></script><script src="../js/radar-s14-z-sources.js"></script>
</head><body><div id="standard-references-panel"></div><pre id="result">pending</pre><script>
(async()=>{
 const report={operation:'S16-A-R2-BROWSER',checks:[],errors:[],ok:false};
 const assert=(v,m)=>{if(!v)throw Error(m);return v;};const wait=async fn=>{for(let i=0;i<300;i++){if(fn())return;await new Promise(r=>setTimeout(r,30));}throw Error('Timeout');};
 const check=async(name,fn)=>{await fn();report.checks.push({name,ok:true});};
 window.addEventListener('error',e=>report.errors.push(e.message));window.addEventListener('unhandledrejection',e=>report.errors.push(String(e.reason)));
 try{
 const api=window.__radarStandardSources,store=window.__radarCatalogPersistence,base=api.W3C,calls=[];
 const xml='<rfc-index xmlns="https://www.rfc-editor.org/rfc-index"><rfc-entry><doc-id>RFC9110</doc-id><title>HTTP Semantics</title><date><month>June</month><year>2022</year></date><stream>IETF</stream><current-status>INTERNET STANDARD</current-status></rfc-entry></rfc-index>';
 const stamp='2026-11-16T00:00:00.000Z',version=api.w3cRecord({uri:'https://www.w3.org/TR/2020/REC-json-ld11-20200716/',date:'2020-07-16',title:'JSON-LD 1.1',status:'Recommendation'},'json-ld11');
 window.fetch=async url=>{url=String(url);calls.push(url);if(url.endsWith('standard-source-cache/rfc-editor.json'))return new Response(JSON.stringify({schemaVersion:1,sourceId:'rfc-editor',acquiredAt:stamp,payload:xml}));if(url.endsWith('standard-source-cache/w3c.json'))return new Response(JSON.stringify({schemaVersion:1,sourceId:'w3c',acquiredAt:stamp,payload:[api.w3cLink({href:base+'/json-ld11',title:'JSON-LD 1.1'})]}));if(url.endsWith('standard-source-cache/w3c-json-ld11.json'))return new Response(JSON.stringify({schemaVersion:1,sourceId:'w3c',shortname:'json-ld11',acquiredAt:stamp,payload:[version]}));throw Error('Network disabled in isolated fixture: '+url);};
 window.__radarRevisionSession={exportGroup:()=>null,status:()=>({activeGroup:null})};window.__radarIsoWindowed={current:async()=>({generation:'fixture',summary:{release:'fixture',datasets:{deliverables:{count:0}}}}),page:async()=>({records:[],next:null})};window.__radarIsoFullGrid={project:()=>[]};
 window.__radarStandardsPanel.initialize(document.getElementById('standard-references-panel'),()=>null);const g=w2ui.standardReferencesGrid,t=w2ui.standardsToolbar;
 if(window.__radarApplicationProfile.viewer){assert(!t,'Viewer has source toolbar');report.checks.push({name:'Viewer native only',ok:true});}else{
 assert(t,'W2UI toolbar missing');const click=async id=>{t.click(id);await new Promise(r=>setTimeout(r,100));};const select=async id=>{g.select(id);g.click(id);await new Promise(r=>setTimeout(r,100));};
 await check('inventory and source selector',async()=>{await click('source:resources');await wait(()=>g.records.length===29);assert(!calls.some(u=>u.includes('standard-source-cache/')),'Implicit source acquisition');});
 await check('W3C without native catalog',async()=>{await click('source:w3c');await click('acquisition:load');await wait(()=>g.records.some(r=>r.recid==='json-ld11'));await select('json-ld11');await click('versions');await wait(()=>g.records.some(r=>r.recid==='json-ld11:20200716'));await select('json-ld11:20200716');assert(t.get('integrate').disabled,'Integration without catalog');});
 await check('exact W3C integration',async()=>{store.remember({schemaVersion:'1.0.0',title:'Disposable R2 fixture',organizations:[],portfolios:[],standards:[],assessments:[],radarRevisions:[{schemaVersion:'1.0.0',revisionId:'pub',radarId:'rad',status:'published',blips:[]}]},{revisions:[{group:'g0',revisionId:'pub'}]});window.__radarStandardsPanel.refresh();await select('json-ld11:20200716');await click('integrate');await wait(()=>store.listReferenceRecords().some(r=>r.standardId==='w3c-tr:json-ld11:20200716'));});
 await check('RFC common grid',async()=>{await click('source:rfc-editor');await click('acquisition:load');await wait(()=>g.records.some(r=>r.recid==='9110'));await select('9110');await click('integrate');await wait(()=>store.listReferenceRecords().some(r=>r.standardId==='rfc:9110'));});
 await check('OMG private file and distinct ISO adoptions',async()=>{await click('source:omg-specifications');window.confirm=()=>{throw Error('Unexpected OMG authorization prompt');};const html='<table><tr><th>Name</th><th>Acronym</th><th>Version</th><th>Status</th><th>Publication Date</th></tr><tr><td>Example Model</td><td>EXAMPLE</td><td><a href="/spec/EXAMPLE/2.0">2.0</a></td><td>formal</td><td>August 2020</td></tr></table><table><tr><th>Specification Title</th><th>Version</th><th>ISO Number</th><th>OMG File ID</th></tr><tr><td>Example Model</td><td><a href="/spec/EXAMPLE/1.0">1.0</a></td><td>12345:2020</td><td>formal/20-01-01</td></tr></table>';const dt=new DataTransfer();dt.items.add(new File([html],'fixture.html',{type:'text/html'}));const input=document.querySelector('[data-omg-file]');input.files=dt.files;input.dispatchEvent(new Event('change',{bubbles:true}));await wait(()=>g.records.some(r=>r.recid==='EXAMPLE/2.0'));await click('omgView:adoptions');await wait(()=>g.records.some(r=>r.recid==='EXAMPLE/1.0'));assert(api.omgStatus().origin==='local-unverified','Provenance');assert(store.listReferenceRecords().length===2,'Unexpected mutation');});
 await check('language and ISO return',async()=>{await i18next.changeLanguage('en');assert(t.get('source').text.includes('Documentary source'),'English');await i18next.changeLanguage('fr');await click('source:iso-open-data');assert(!t.get('isoView').hidden,'ISO navigation');});
 }
 report.ok=report.errors.length===0;
 }catch(e){report.errors.push(e.stack||e.message);}finally{document.getElementById('result').textContent=JSON.stringify(report);document.body.dataset.finished='true';}
})();
</script></body></html>
