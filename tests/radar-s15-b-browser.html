</head><body><div id="standard-references-panel"></div><pre id="result">pending</pre><script>
(async()=>{
 const live=new URLSearchParams(location.search).has('live'),report={operation:'S15-B-BROWSER',live,checks:[],errors:[],ok:false};const errors=[],calls=[];

 const assert=(v,m)=>{if(!v)throw Error(m);return v;},wait=async fn=>{const until=Date.now()+15000;while(Date.now()<until){const v=fn();if(v)return v;await new Promise(r=>setTimeout(r,40));}throw Error('Timed out waiting for control or source');};
 const check=async(name,fn)=>{try{const detail=await fn();report.checks.push({name,ok:true,detail});}catch(e){report.checks.push({name,ok:false,error:e.message});throw e;}};
 const q=s=>assert(document.querySelector(s),'Missing '+s),click=s=>q(s).click(),change=(s,v,type='change')=>{const n=q(s);n.value=v;n.dispatchEvent(new Event(type,{bubbles:true}));};
 try{
  const html=await(await fetch('../radar.html')).text(),rule=html.match(/select\s*\{[^}]*\}/)?.[0];assert(rule,'Application select rule missing');const style=document.createElement('style');style.textContent=rule;document.head.appendChild(style);
  const realFetch=window.fetch.bind(window),api=window.__radarStandardSources,store=window.__radarCatalogPersistence,viewer=window.__radarApplicationProfile.viewer,base=api.W3C;
  let failRefresh=false;
  let xml='<rfc-index xmlns="https://www.rfc-editor.org/rfc-index"><rfc-entry><doc-id>RFC9110</doc-id><title>HTTP Semantics</title><date><month>June</month><year>2022</year></date><stream>IETF</stream><current-status>INTERNET STANDARD</current-status></rfc-entry><rfc-entry><doc-id>RFC0001</doc-id><title>Host Software</title><date><month>April</month><year>1969</year></date><current-status>HISTORIC</current-status></rfc-entry></rfc-index>';
  const historicalShort='daml+oil-axioms',historicalKey=historicalShort+':20011218';
  const historicalVersion={uri:'http://www.w3.org/TR/2001/NOTE-daml+oil-axioms-20011218',date:'2001-12-18',title:'An Axiomatic Semantics for RDF, RDF-S, and DAML+OIL (March 2001)',status:'Note',_links:{self:{href:base+'/'+historicalShort+'/versions/20011218'}}};
  const version={uri:'https://www.w3.org/TR/2020/REC-json-ld11-20200716/',date:'2020-07-16',title:'JSON-LD 1.1',status:'Recommendation',_links:{self:{href:base+'/json-ld11/versions/20200716'}}};
  window.fetch=async(url,opts)=>{url=String(url);if(url.includes('standard-source-cache/')||url===api.RFC||url.startsWith(base)){calls.push(url);if(url.includes('standard-source-cache/'))return live?realFetch(url,opts):new Response('',{status:404});if(live||failRefresh)throw Error('External access intentionally blocked');if(url===api.RFC)return new Response(xml);if(url.startsWith(base+'/json-ld11/versions?'))return new Response(JSON.stringify({_embedded:{'version-history':[version]}}));if(url.startsWith(base+'/'+historicalShort+'/versions?'))return new Response(JSON.stringify({_embedded:{'version-history':[historicalVersion]}}));if(url.startsWith(base+'?'))return new Response(JSON.stringify({_links:{specifications:[{href:base+'/json-ld11',title:'JSON-LD 1.1'},{href:base+'/'+historicalShort,title:historicalVersion.title}]}}));throw Error('Unexpected source URL: '+url);}return realFetch(url,opts);};
  const standards=[{standardId:'legacy',name:'Historical reference'}];if(viewer)standards.push({standardId:'rfc:9110',name:'HTTP Semantics',extensions:{referenceDeclaration:{issuer:'IETF',designation:'RFC 9110',editionDesignation:'2022-06',sourceName:'RFC Editor',origin:'rfc-editor',verification:'source-verified'}}});
  window.__radarRevisionSession={exportGroup:()=>null,status:()=>({activeGroup:null})};
  store.remember({schemaVersion:'1.0.0',title:'Disposable S15-B/C',organizations:[],portfolios:[],standards,assessments:[],radarRevisions:[{schemaVersion:'1.0.0',revisionId:'pub',radarId:'rad',status:'published',blips:[{blipId:'legacy-blip',standardId:'legacy',label:'Published dependency'}]}]},{revisions:[{group:'g0',revisionId:'pub'}]});
  window.__radarIsoWindowed={current:async()=>({generation:'fixture',summary:{release:'fixture',datasets:{deliverables:{count:0}}}}),page:async()=>({records:[],next:null})};
  window.__radarStandardsPanel.initialize(q('#standard-references-panel'),()=>null);window.__radarStandardsPanel.openReferences();await new Promise(r=>setTimeout(r,300));const g=window.w2ui.standardReferencesGrid;
  await check('no external acquisition at startup',()=>{assert(!calls.length,'Unexpected source network at startup');return {calls:calls.length};});
  if(viewer){
   await check('Viewer portable imported reference and no author acquisition',()=>{assert(!document.querySelector('[data-standard-sources]'),'Source control available in Viewer');assert(!document.querySelector('[data-native-declare]'),'Declare available');assert(g.records.some(r=>r.standardId==='rfc:9110'),'Portable RFC missing');assert(!calls.length,'Viewer calls source');return {records:g.records.length};});
   await check('S15-C Viewer has no lifecycle controls',()=>{assert(!document.querySelector('[data-reference-lifecycle]'),'Lifecycle command in Viewer');let rejected=false;try{store.referenceImpact(null,'legacy');}catch(e){rejected=true;}assert(rejected,'Viewer lifecycle API accepted');return {blocked:true};});
  }else{
   const open=()=>click('[data-standard-sources]'),load=()=>click('[data-source-load]'),choose=key=>click(`[data-source-result="${key}"]`),result=key=>wait(()=>document.querySelector(`[data-source-result="${key}"]:not([disabled])`)),search=v=>change('[data-source-query]',v,'input');
   await check('common source picker and compact layout',()=>{open();const sel=q('[data-source-picker]');assert(sel.options.length===3,'Three source choices required');assert(sel.getBoundingClientRect().height<=34,'Source picker too tall');return {choices:[...sel.options].map(o=>o.value)};});
   await check('RFC acquisition, search and source selection',async()=>{search('9110');load();await result('9110');choose('9110');assert(q('[data-source-detail] a').href==='https://www.rfc-editor.org/rfc/rfc9110','RFC URL');assert(q('[data-source-detail]').textContent.includes('HTTP Semantics'),'RFC title');return api.status('rfc-editor');});
   await check('language switch preserves RFC selection',async()=>{await i18next.changeLanguage('en');assert(q('#standard-source-heading').textContent==='Standardization sources','English dialog');assert(q('[data-source-integrate]').textContent==='Add to catalog','English command');await i18next.changeLanguage('fr');assert(q('[data-source-integrate]').textContent==='Ajouter au catalogue','French command');return {language:i18next.language};});
   await check('actual RFC integration and complete native grid',()=>{click('[data-source-integrate]');assert(!document.querySelector('#standard-source-dialog'),'Dialogue not closed');assert(g.records.length===2,'Grid missing references');assert(g.getSelection().includes('rfc:9110'),'RFC not selected');assert(store.listReferenceRecords().find(r=>r.standardId==='rfc:9110')?.verification==='source-verified','Provenance lost');return {records:g.records.length};});
   await check('RFC repeat integration is idempotent',async()=>{open();search('9110');await result('9110');choose('9110');click('[data-source-integrate]');assert(store.listReferenceRecords().length===2,'Duplicated RFC');return {records:2};});
   await check('W3C series and exact dated publication',async()=>{open();change('[data-source-picker]','w3c');search('json-ld11');load();await result('json-ld11');choose('json-ld11');await result('json-ld11:20200716');choose('json-ld11:20200716');assert(q('[data-source-detail] a').href.includes('20200716'),'Dated W3C link');click('[data-source-integrate]');assert(g.getSelection().includes('w3c-tr:json-ld11:20200716'),'W3C not selected');assert(store.listReferenceRecords().length===3,'W3C not integrated');return {records:3};});
   await check('origin filters and real W2UI sort',()=>{change('[data-native-origin-filter]','rfc-editor');assert(g.records.length===1&&g.records[0].standardId==='rfc:9110','RFC origin filter');change('[data-native-origin-filter]','w3c');assert(g.records.length===1&&g.records[0].standardId.startsWith('w3c-tr:'),'W3C origin filter');change('[data-native-origin-filter]','all');for(const c of g.columns.filter(c=>c.sortable)){g.sort(c.field,'asc');g.sort(c.field,'desc');}assert(g.records.length===3,'Rows lost');return {records:3};});
   await check('failed refresh leaves previously loaded catalogue usable',async()=>{const old=api.status('rfc-editor').generation;let rejected=false;failRefresh=true;try{await api.load('rfc-editor',{refresh:true});}catch{rejected=true;}finally{failRefresh=false;}assert(rejected&&api.status('rfc-editor').generation===old,'Cache not preserved');assert(api.search('rfc-editor','9110').rows.length>0,'Cached search lost');return {generation:old};});
   await check('historical W3C plus shortname selection and integration',async()=>{open();change('[data-source-picker]','w3c');search(historicalShort);await result(historicalShort).catch(e=>{throw Error('Historical series unavailable: '+e.message);});choose(historicalShort);await result(historicalKey).catch(e=>{throw Error('Historical version unavailable: '+e.message+'; dialog: '+q('#standard-source-dialog').textContent.slice(-800));});choose(historicalKey);assert(q('[data-source-detail] a').href.includes('20011218'),'Historical dated link');click('[data-source-integrate]');assert(g.getSelection().includes('w3c-tr:'+historicalKey),'Historical W3C not selected');const row=store.listReferenceRecords().find(r=>r.standardId==='w3c-tr:'+historicalKey);assert(row?.externalDocument?.status==='Note','Historical Note status lost');assert(g.records.length===4,'Historical reference missing');return {standardId:row.standardId,status:row.externalDocument.status,records:g.records.length};});
   await check('S15-C published dependency and FR/EN lifecycle controls',async()=>{g.selectNone?.();g.select('legacy');click('[data-reference-lifecycle]');const dialog=q('#standard-reference-lifecycle');assert(dialog.textContent.includes('legacy-blip')||dialog.textContent.includes('Published dependency'),'Published dependency missing');assert(q('[data-lifecycle-remove]').disabled,'Used reference removable');await i18next.changeLanguage('en');assert(dialog.querySelector('h2').textContent==='Reference lifecycle','English lifecycle');assert(dialog.textContent.includes('Published'),'Published status not translated');await i18next.changeLanguage('fr');assert(dialog.querySelector('h2').textContent==='Cycle de vie de la référence','French lifecycle');dialog.querySelector('button:last-child').click();return {used:true};});
   await check('S15-C exact local reconciliation and source comparison',async()=>{const row=api.search('rfc-editor','Host Software').rows.find(r=>r.key==='1');assert(row,'RFC 1 missing');store.declareLocalReference({standardId:'local-rfc-1',name:'Local RFC 1',extensions:{referenceDeclaration:{issuer:row.issuer,designation:row.designation,editionDesignation:row.edition,sourceName:'Manual entry',origin:'manual',verification:'unverified'}}});open();search('Host Software');await result('1');choose('1');assert(q('[data-source-comparison]').textContent.includes('Local RFC 1'),'Comparison missing');assert(q('[data-source-lifecycle-apply]').disabled,'Confirmation required');const c=q('[data-source-lifecycle-confirm]');c.checked=true;c.dispatchEvent(new Event('change',{bubbles:true}));await i18next.changeLanguage('en');assert(q('[data-source-lifecycle-apply]').textContent==='Reconcile this unused declaration','English reconciliation');assert(q('[data-source-lifecycle-confirm]').checked,'Confirmation lost on language change');await i18next.changeLanguage('fr');click('[data-source-lifecycle-apply]');const saved=store.listReferenceRecords().find(r=>r.standardId==='local-rfc-1');assert(saved?.externalDocument?.key==='1'&&saved.verification==='source-verified','Reconciliation failed');assert(!store.listReferenceRecords().some(r=>r.standardId==='rfc:1'),'Canonical duplicate');assert(g.getSelection().includes('local-rfc-1'),'Reconciled reference not selected');open();search('Host Software');await result('1');choose('1');assert(q('[data-source-comparison]').textContent.includes('correspond'),'Unchanged comparison missing');assert(!document.querySelector('[data-source-lifecycle-apply]'),'Unchanged record can be updated');click('[data-source-integrate]');assert(g.getSelection().includes('local-rfc-1'),'Reconciled identity not reused');return {standardId:saved.standardId,records:g.records.length};});
   await check('S15-C explicit removal of unused reference',()=>{g.selectNone?.();g.select('local-rfc-1');click('[data-reference-lifecycle]');assert(q('[data-lifecycle-remove]').disabled,'Removal without confirmation');const c=q('[data-lifecycle-confirm]');c.checked=true;c.dispatchEvent(new Event('change',{bubbles:true}));assert(!q('[data-lifecycle-remove]').disabled,'Unused reference cannot be removed');click('[data-lifecycle-remove]');assert(!document.querySelector('#standard-reference-lifecycle'),'Lifecycle dialog not closed');assert(!store.listReferenceRecords().some(r=>r.standardId==='local-rfc-1'),'Removed reference remains');assert(g.records.length===4&&g.records.some(r=>r.standardId==='legacy'),'Grid or published reference damaged');return {records:g.records.length};});
   if(!live)await check('S15-C explicit metadata refresh keeps identity',async()=>{xml=xml.replace('HTTP Semantics','HTTP Semantics (updated fixture)');open();search('9110');click('[data-source-refresh]');await result('9110');choose('9110');assert(q('[data-source-comparison]').textContent.includes('updated fixture'),'Changed metadata not shown');assert(q('[data-source-lifecycle-apply]').disabled,'Refresh without confirmation');const c=q('[data-source-lifecycle-confirm]');c.checked=true;c.dispatchEvent(new Event('change',{bubbles:true}));assert(store.listReferenceRecords().find(r=>r.standardId==='rfc:9110').name==='HTTP Semantics','Implicit metadata change');click('[data-source-lifecycle-apply]');assert(store.listReferenceRecords().find(r=>r.standardId==='rfc:9110').name==='HTTP Semantics (updated fixture)','Explicit update missing');assert(g.records.length===4&&g.getSelection().includes('rfc:9110'),'Identity or grid changed');return {standardId:'rfc:9110',records:g.records.length};});

  }
  await check('no runtime errors',()=>{assert(!errors.length,errors.join('; '));return errors;});report.ok=true;
 }catch(e){report.errors.push(e.stack||e.message);}finally{document.getElementById('result').textContent=JSON.stringify(report);document.body.dataset.finished='true';}
})();
